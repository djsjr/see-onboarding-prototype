<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Alcohol Onboarding Flow</title>
    <style>
      @font-face {
        font-family: "Gilroy";
        src: url("assets/fonts/Gilroy-ExtraBold.otf") format("opentype");
        font-weight: 800;
      }

      @font-face {
        font-family: "Public Sans";
        src: url("assets/fonts/PublicSans-SemiBold.ttf") format("truetype");
        font-weight: 800;
      }

      :root {
        --blue: #3157c9;
        --dark: #252323;
        --light: #ffffff;
        --yellow: #fad250;
        --phone-width: 430px;
        --phone-height: 932px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #17120a;
        color: var(--dark);
        font-family: "Public Sans", system-ui, sans-serif;
      }

      .overview-link {
        position: fixed;
        top: 18px;
        right: 18px;
        z-index: 5;
        color: var(--light);
        font: 800 14px/1 "Public Sans", sans-serif;
        text-decoration: none;
        background: rgba(49, 87, 201, 0.9);
        border-radius: 999px;
        padding: 10px 14px;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.24);
      }

      .phone {
        position: relative;
        width: min(var(--phone-width), 100vw);
        height: min(var(--phone-height), 100vh);
        overflow: hidden;
        background: #ffe68e url("assets/images/background_yellow.png") center/cover no-repeat;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      }

      .screen {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        padding: 28px 24px 20px;
        opacity: 0;
        pointer-events: none;
        transform: translateX(18px);
        transition: opacity 180ms ease, transform 180ms ease;
      }

      .screen.is-active {
        opacity: 1;
        pointer-events: auto;
        transform: translateX(0);
      }

      .back-arrow {
        position: absolute;
        top: 28px;
        left: 24px;
        z-index: 3;
        width: 42px;
        height: 42px;
        border: 0;
        background: transparent;
        color: var(--dark);
        font: 800 42px/0.8 "Gilroy", sans-serif;
        display: none;
        cursor: pointer;
      }

      .back-arrow.is-visible {
        display: block;
      }

      .content-center {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: stretch;
        min-height: 0;
      }

      .content-scroll {
        flex: 1;
        overflow: auto;
        padding: 52px 0 22px 10px;
      }

      .headline {
        margin: 0;
        color: var(--dark);
        font: 800 50px/1.05 "Gilroy", sans-serif;
        white-space: pre-line;
      }

      .headline.medium {
        font-size: 42px;
      }

      .headline.small {
        font-size: 36px;
      }

      .body {
        margin: 20px 0 0;
        color: var(--blue);
        font: 800 18px/1.22 "Public Sans", sans-serif;
        white-space: pre-line;
      }

      .body.dark {
        color: var(--dark);
      }

      .primary-button {
        width: 100%;
        min-height: 56px;
        border: 0;
        border-radius: 999px;
        background: var(--blue);
        color: var(--light);
        font: 800 18px/1 "Gilroy", sans-serif;
        box-shadow: 0 7px 12px rgba(37, 35, 35, 0.25);
        cursor: pointer;
      }

      .choice-stack,
      .radio-list,
      .checklist {
        display: grid;
        gap: 16px;
        margin-top: 30px;
      }

      .choice,
      .radio-row,
      .check-row,
      .answer-choice {
        border: 0;
        background: rgba(255, 255, 255, 0.5);
        color: var(--dark);
        border-radius: 10px;
        min-height: 76px;
        padding: 10px 14px;
        display: flex;
        align-items: center;
        gap: 14px;
        text-align: left;
        font: 800 22px/1.08 "Gilroy", sans-serif;
        cursor: pointer;
      }

      .choice.is-selected,
      .radio-row.is-selected,
      .check-row.is-selected,
      .answer-choice.is-selected {
        background: var(--blue);
        color: var(--light);
        box-shadow: 0 5px 10px rgba(37, 35, 35, 0.26);
      }

      .choice-icon {
        width: 78px;
        height: 78px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.94);
        display: grid;
        place-items: center;
        flex: 0 0 auto;
      }

      .choice-icon img {
        max-width: 48px;
        max-height: 48px;
      }

      .ring {
        width: 28px;
        height: 28px;
        border: 3px solid currentColor;
        border-radius: 50%;
        display: inline-grid;
        place-items: center;
        flex: 0 0 auto;
      }

      .is-selected .ring::after {
        content: "";
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: currentColor;
      }

      .answer-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        margin-top: 34px;
      }

      .answer-choice {
        justify-content: center;
        text-align: center;
      }

      .art {
        display: block;
        max-width: 72%;
        max-height: 245px;
        object-fit: contain;
        margin: 30px auto;
      }

      .video-placeholder {
        width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 10px;
        background: var(--blue);
        color: var(--light);
        display: grid;
        place-items: center;
        margin: 26px 0 6px;
        font: 800 24px/1 "Gilroy", sans-serif;
        box-shadow: 0 8px 18px rgba(37, 35, 35, 0.24);
      }

      .impact-progress {
        display: flex;
        gap: 4px;
        justify-content: center;
        margin-top: 2px;
      }

      .impact-progress span {
        width: 24px;
        height: 10px;
        transform: skewX(-28deg);
        background: rgba(49, 87, 201, 0.38);
      }

      .impact-progress span.is-active {
        width: 54px;
        background: var(--blue);
      }

      .scale-card {
        margin-top: 28px;
        position: relative;
      }

      .scale-card img {
        width: 100%;
        display: block;
      }

      .scale-display,
      .scale-copy {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        font-family: "Gilroy", sans-serif;
        font-weight: 800;
      }

      .scale-display {
        top: 3.8%;
        width: 42%;
        color: var(--yellow);
        background: #222;
        border: 2px solid rgba(255, 255, 255, 0.85);
        border-radius: 7px;
        padding: 7px 6px 4px;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.35);
      }

      .scale-display .big {
        display: block;
        font-size: 22px;
        line-height: 0.9;
        letter-spacing: 1px;
      }

      .scale-display .small {
        display: block;
        margin-top: 3px;
        font-size: 9px;
        line-height: 1;
      }

      .scale-copy {
        top: 30.5%;
        width: 74%;
      }

      .scale-copy .white {
        color: var(--light);
        font-size: 17px;
        line-height: 1.05;
      }

      .scale-copy .yellow {
        color: var(--yellow);
        font-size: 40px;
        line-height: 0.98;
      }

      .scale-copy .pounds {
        color: var(--yellow);
        font-size: 68px;
        line-height: 0.95;
        margin-top: 20px;
      }

      .scale-copy .or {
        color: var(--light);
        font-size: 15px;
        line-height: 1;
        margin: 20px auto 0;
      }

      @media (max-width: 520px) {
        .phone {
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <a class="overview-link" href="overview.html">See overview</a>
    <main class="phone" aria-live="polite">
      <button class="back-arrow" type="button" aria-label="Go back">‹</button>
      <div data-screen-host></div>
    </main>

    <script src="flow-data.js"></script>
    <script>
      const flow = window.SEE_ONBOARDING_FLOW;
      const host = document.querySelector("[data-screen-host]");
      const backArrow = document.querySelector(".back-arrow");
      const historyStack = [];
      let active = flow.firstScreen;
      let goal = null;
      let drinkIndex = flow.screens.drinks.selectedIndex;

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function lineBreaks(value) {
        return escapeHtml(value).replaceAll("\n", "<br />");
      }

      function bodyMarkup(body, dark = false) {
        if (!body) return "";
        const items = Array.isArray(body) ? body : [body];
        return items.map((item) => `<p class="body ${dark ? "dark" : ""}">${lineBreaks(item)}</p>`).join("");
      }

      function progress(index) {
        if (!Number.isInteger(index)) return "";
        return `
          <div class="impact-progress" aria-hidden="true">
            ${Array.from({ length: 6 }, (_, itemIndex) => `<span class="${itemIndex === index ? "is-active" : ""}"></span>`).join("")}
          </div>
        `;
      }

      function buttonMarkup(label = "continue") {
        return `<button class="primary-button" type="button" data-continue>${escapeHtml(label)}</button>`;
      }

      function renderGoal(screen) {
        return `
          <section class="screen is-active" data-screen="goal">
            <div class="content-center">
              <h1 class="headline">${lineBreaks(screen.headline)}</h1>
              <div class="choice-stack">
                ${screen.choices
                  .map(
                    (choice) => `
                      <button class="choice ${choice.goal === goal ? "is-selected" : ""}" type="button" data-goal="${choice.goal}">
                        <span class="choice-icon"><img src="${flow.assets[choice.imageKey]}" alt="" /></span>
                        <span>${escapeHtml(choice.label)}</span>
                      </button>
                    `
                  )
                  .join("")}
              </div>
            </div>
          </section>
        `;
      }

      function renderRadio(screen) {
        return `
          <section class="screen is-active" data-screen="drinks">
            <div class="content-scroll">
              <h1 class="headline medium">${lineBreaks(screen.headline)}</h1>
              <div class="radio-list">
                ${screen.options
                  .map(
                    (option, index) => `
                      <button class="radio-row ${index === drinkIndex ? "is-selected" : ""}" type="button" data-drink-index="${index}">
                        <span class="ring"></span><span>${escapeHtml(option)}</span>
                      </button>
                    `
                  )
                  .join("")}
              </div>
            </div>
            ${buttonMarkup()}
          </section>
        `;
      }

      function renderChecklist(screen) {
        return `
          <section class="screen is-active" data-screen="cost">
            <div class="content-scroll">
              <h1 class="headline medium">${lineBreaks(screen.headline)}</h1>
              ${bodyMarkup(screen.body)}
              <div class="checklist">
                ${screen.options
                  .map(
                    (option, index) => `
                      <button class="check-row ${(screen.selectedIndexes || []).includes(index) ? "is-selected" : ""}" type="button">
                        <span class="ring"></span><span>${escapeHtml(option)}</span>
                      </button>
                    `
                  )
                  .join("")}
              </div>
            </div>
            ${buttonMarkup()}
          </section>
        `;
      }

      function renderScale(screen) {
        const scale = flow.sampleScale;
        return `
          <section class="screen is-active" data-screen="scale">
            <div class="content-center">
              <h1 class="headline medium">${lineBreaks(screen.headline)}</h1>
              <div class="scale-card">
                <img src="${flow.assets.scale}" alt="" />
                <div class="scale-display">
                  <span class="big">${scale.displayWeeklyDrinks} DRINKS</span>
                  <span class="small">PER WEEK</span>
                </div>
                <div class="scale-copy">
                  <div class="white">That’s</div>
                  <div class="yellow">${scale.dailyCaloriesLow}–${scale.dailyCaloriesHigh}</div>
                  <div class="white">calories per day</div>
                  <div class="or">or</div>
                  <div class="pounds">${scale.yearlyPounds} lbs</div>
                  <div class="white">per year.</div>
                </div>
              </div>
            </div>
            ${buttonMarkup()}
          </section>
        `;
      }

      function renderQuestion(screen) {
        return `
          <section class="screen is-active" data-screen="${active}">
            <div class="content-center">
              <h1 class="headline medium">${lineBreaks(screen.headline)}</h1>
              ${bodyMarkup(screen.body)}
              <div class="answer-row">
                <button class="answer-choice" type="button" data-answer>${escapeHtml(screen.yes)}</button>
                <button class="answer-choice" type="button" data-answer>${escapeHtml(screen.no)}</button>
              </div>
            </div>
          </section>
        `;
      }

      function renderCopy(screen) {
        return `
          <section class="screen is-active" data-screen="${active}">
            <div class="content-center">
              <h1 class="headline ${screen.headlineSize || ""}">${lineBreaks(screen.headline)}</h1>
              ${bodyMarkup(screen.body)}
            </div>
            ${buttonMarkup(screen.button)}
          </section>
        `;
      }

      function renderVideoCopy(screen) {
        return `
          <section class="screen is-active" data-screen="${active}">
            <div class="content-center">
              <h1 class="headline ${screen.headlineSize || ""}">${lineBreaks(screen.headline)}</h1>
              ${bodyMarkup(screen.body)}
              <div class="video-placeholder">VIDEO</div>
            </div>
            ${buttonMarkup(screen.button)}
          </section>
        `;
      }

      function renderArtCopy(screen) {
        return `
          <section class="screen is-active" data-screen="${active}">
            <div class="content-center">
              <h1 class="headline ${screen.headlineSize || ""}">${lineBreaks(screen.headline)}</h1>
              <img class="art" src="${flow.assets[screen.imageKey]}" alt="" />
              ${bodyMarkup(screen.body, true)}
            </div>
            ${buttonMarkup(screen.button)}
          </section>
        `;
      }

      function renderBenefit(screen) {
        return `
          <section class="screen is-active" data-screen="${active}">
            ${progress(screen.progressIndex)}
            <div class="content-center">
              <h1 class="headline medium">${lineBreaks(screen.headline)}</h1>
              ${bodyMarkup(screen.body)}
              <img class="art" src="${flow.assets[screen.imageKey]}" alt="" />
            </div>
            ${buttonMarkup()}
          </section>
        `;
      }

      function renderScreen() {
        const screen = flow.screens[active];
        if (!screen) return "";
        if (screen.type === "goal") return renderGoal(screen);
        if (screen.type === "radio") return renderRadio(screen);
        if (screen.type === "checklist") return renderChecklist(screen);
        if (screen.type === "scale") return renderScale(screen);
        if (screen.type === "question") return renderQuestion(screen);
        if (screen.type === "artCopy") return renderArtCopy(screen);
        if (screen.type === "videoCopy") return renderVideoCopy(screen);
        if (screen.type === "benefit") return renderBenefit(screen);
        return renderCopy(screen);
      }

      function goTo(next, replace = false) {
        if (!next || !flow.screens[next]) return;
        if (!replace) historyStack.push(active);
        active = next;
        draw();
      }

      function continueFromCurrent() {
        const screen = flow.screens[active];
        if (!screen) return;
        if (screen.type === "goal") return;
        goTo(screen.next);
      }

      function draw() {
        host.innerHTML = renderScreen();
        backArrow.classList.toggle("is-visible", historyStack.length > 0);

        host.querySelectorAll("[data-goal]").forEach((button) => {
          button.addEventListener("click", () => {
            goal = button.dataset.goal;
            const choice = flow.screens.goal.choices.find((item) => item.goal === goal);
            goTo(choice.next);
          });
        });

        host.querySelectorAll("[data-drink-index]").forEach((button) => {
          button.addEventListener("click", () => {
            drinkIndex = Number(button.dataset.drinkIndex);
            draw();
          });
        });

        host.querySelectorAll(".check-row").forEach((button) => {
          button.addEventListener("click", () => button.classList.toggle("is-selected"));
        });

        host.querySelectorAll("[data-answer]").forEach((button) => {
          button.addEventListener("click", () => {
            button.classList.add("is-selected");
            window.setTimeout(continueFromCurrent, 120);
          });
        });

        host.querySelector("[data-continue]")?.addEventListener("click", continueFromCurrent);
      }

      backArrow.addEventListener("click", () => {
        const previous = historyStack.pop();
        if (!previous) return;
        active = previous;
        draw();
      });

      draw();
    </script>
  </body>
</html>
