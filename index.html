<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Alcohol Onboarding Flow</title>
    <style>
      @font-face {
        font-family: "Gilroy";
        src: url("assets/fonts/Gilroy-ExtraBold.otf") format("opentype");
        font-weight: 800;
      }

      @font-face {
        font-family: "Public Sans";
        src: url("assets/fonts/PublicSans-SemiBold.ttf") format("truetype");
        font-weight: 800;
      }

      :root {
        --blue: #3157c9;
        --dark: #252323;
        --light: #ffffff;
        --yellow: #fad250;
        --phone-width: 430px;
        --phone-height: 932px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #17120a;
        color: var(--dark);
        font-family: "Public Sans", system-ui, sans-serif;
      }

      .overview-link {
        position: fixed;
        top: 18px;
        right: 18px;
        z-index: 5;
        color: var(--light);
        font: 800 14px/1 "Public Sans", sans-serif;
        text-decoration: none;
        background: rgba(49, 87, 201, 0.9);
        border-radius: 999px;
        padding: 10px 14px;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.24);
      }

      .phone {
        position: relative;
        width: min(var(--phone-width), 100vw);
        height: min(var(--phone-height), 100vh);
        overflow: hidden;
        background: #ffe68e url("assets/images/background_yellow.png") center/cover no-repeat;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      }

      .screen {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        padding: 28px 24px 20px;
        opacity: 0;
        pointer-events: none;
        transform: translateX(18px);
        transition: opacity 180ms ease, transform 180ms ease;
      }

      .screen.is-active {
        opacity: 1;
        pointer-events: auto;
        transform: translateX(0);
      }

      .back-arrow {
        position: absolute;
        top: 28px;
        left: 24px;
        z-index: 3;
        width: 42px;
        height: 42px;
        border: 0;
        background: transparent;
        color: var(--dark);
        font: 800 42px/0.8 "Gilroy", sans-serif;
        display: none;
        cursor: pointer;
      }

      .back-arrow.is-visible {
        display: block;
      }

      .content-center {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: stretch;
        min-height: 0;
      }

      .content-scroll {
        flex: 1;
        overflow: auto;
        padding: 52px 0 22px 10px;
      }

      .headline {
        margin: 0;
        color: var(--dark);
        font: 800 50px/1.05 "Gilroy", sans-serif;
        white-space: pre-line;
      }

      .headline.medium {
        font-size: 42px;
      }

      .headline.size-48 {
        font-size: 48px;
      }

      .headline.size-46 {
        font-size: 46px;
      }

      .headline.size-44 {
        font-size: 44px;
      }

      .headline.size-40 {
        font-size: 40px;
      }

      .headline.small {
        font-size: 36px;
      }

      .body {
        margin: 20px 0 0;
        color: var(--blue);
        font: 800 18px/1.22 "Public Sans", sans-serif;
        white-space: pre-line;
      }

      .body.dark {
        color: var(--dark);
      }

      .primary-button {
        width: 100%;
        min-height: 56px;
        border: 0;
        border-radius: 999px;
        background: var(--blue);
        color: var(--light);
        font: 800 18px/1 "Gilroy", sans-serif;
        box-shadow: 0 7px 12px rgba(37, 35, 35, 0.25);
        cursor: pointer;
      }

      .choice-stack,
      .radio-list,
      .checklist {
        display: grid;
        gap: 16px;
        margin-top: 30px;
      }

      .choice,
      .radio-row,
      .check-row,
      .answer-choice {
        border: 0;
        background: rgba(255, 255, 255, 0.5);
        color: var(--dark);
        border-radius: 10px;
        min-height: 76px;
        padding: 10px 14px;
        display: flex;
        align-items: center;
        gap: 14px;
        text-align: left;
        font: 800 22px/1.08 "Gilroy", sans-serif;
        cursor: pointer;
      }

      .choice.is-selected,
      .radio-row.is-selected,
      .check-row.is-selected,
      .answer-choice.is-selected {
        background: var(--blue);
        color: var(--light);
        box-shadow: 0 5px 10px rgba(37, 35, 35, 0.26);
      }

      .choice-icon {
        width: 78px;
        height: 78px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.94);
        display: grid;
        place-items: center;
        flex: 0 0 auto;
      }

      .choice-icon img {
        max-width: 48px;
        max-height: 48px;
      }

      .ring {
        width: 28px;
        height: 28px;
        border: 3px solid currentColor;
        border-radius: 50%;
        display: inline-grid;
        place-items: center;
        flex: 0 0 auto;
      }

      .is-selected .ring::after {
        content: "";
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: currentColor;
      }

      .answer-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        margin-top: 34px;
      }

      .answer-choice {
        justify-content: center;
        text-align: center;
      }

      .art {
        display: block;
        width: 72%;
        height: 245px;
        object-fit: contain;
        margin: 30px auto;
      }

      .portrait-photo {
        display: block;
        width: 180px;
        height: 180px;
        object-fit: cover;
        border-radius: 50%;
        margin: 10px auto 0;
        box-shadow: 0 8px 18px rgba(37, 35, 35, 0.22);
      }

      .screen[data-screen="trustedVoice"] .headline + .body {
        margin-top: 30px;
      }

      .screen[data-screen="simplestMeditation"] .headline + .body {
        margin-top: 28px;
      }

      .screen[data-screen="simplestMeditation"] .body:first-of-type {
        font-size: 26px;
        line-height: 1.15;
      }

      .screen[data-screen="simplestMeditation"] .body:first-of-type + .body {
        margin-top: 22px;
      }

      .screen[data-screen="faithCompatible"] .art {
        margin-bottom: 0;
      }

      .screen[data-screen="faithCompatible"] .body {
        color: var(--blue);
      }

      .video-placeholder {
        width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 10px;
        background: var(--blue);
        color: var(--light);
        display: grid;
        place-items: center;
        margin: 26px 0 6px;
        font: 800 24px/1 "Gilroy", sans-serif;
        box-shadow: 0 8px 18px rgba(37, 35, 35, 0.24);
      }

      .video-player-shell {
        position: relative;
        width: 100%;
        aspect-ratio: var(--video-aspect-ratio);
        margin: 22px auto 6px;
        overflow: hidden;
        border-radius: 12px;
        background: #000;
        box-shadow: 0 8px 18px rgba(37, 35, 35, 0.24);
      }

      .video-player-shell.is-portrait {
        align-self: center;
        width: auto;
        height: min(68dvh, 640px);
        max-width: 100%;
      }

      .onboarding-video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
      }

      .video-play-button {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: grid;
        place-items: center;
        width: 100%;
        padding: 0;
        border: 0;
        background: transparent;
        cursor: pointer;
      }

      .video-play-button::before {
        content: "";
        width: 0;
        height: 0;
        margin-left: 4px;
        border-top: 14px solid transparent;
        border-bottom: 14px solid transparent;
        border-left: 22px solid var(--light);
        filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.65));
      }

      .video-play-button:focus-visible {
        outline: 3px solid var(--light);
        outline-offset: -6px;
      }

      .video-play-button[hidden] {
        display: none;
      }

      .video-timestamp[hidden] {
        display: none;
      }

      .screen.video-copy .primary-button {
        width: 76%;
        min-height: 44px;
        align-self: center;
        font-size: 15px;
      }

      .screen.video-copy .content-center {
        justify-content: flex-start;
        padding-top: 50px;
        padding-bottom: 40px;
      }

      .screen.video-copy .subhead {
        margin: 10px 0 0 2px;
        color: var(--blue);
        font: 800 14px/1.18 "Public Sans", sans-serif;
      }

      .screen.video-copy .video-player-shell {
        margin: 10px auto 0;
      }

      .video-timestamp {
        position: absolute;
        right: 8px;
        bottom: 8px;
        z-index: 2;
        padding: 4px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.5);
        color: #ffffff;
        font: 400 12px/1 "Arial", sans-serif;
        pointer-events: none;
      }

      .impact-progress {
        display: flex;
        gap: 4px;
        justify-content: center;
        margin-top: 2px;
      }

      .impact-progress span {
        width: 24px;
        height: 10px;
        transform: skewX(-28deg);
        background: rgba(49, 87, 201, 0.38);
      }

      .impact-progress span.is-active {
        width: 54px;
        background: var(--blue);
      }

      .scale-card {
        margin-top: 28px;
        position: relative;
      }

      .scale-card img {
        width: 100%;
        display: block;
      }

      .scale-display,
      .scale-copy {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        font-family: "Gilroy", sans-serif;
        font-weight: 800;
      }

      .scale-display {
        top: 3.8%;
        width: 42%;
        color: var(--yellow);
        background: #222;
        border: 2px solid rgba(255, 255, 255, 0.85);
        border-radius: 7px;
        padding: 7px 6px 4px;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.35);
      }

      .scale-display .big {
        display: block;
        font-size: 22px;
        line-height: 0.9;
        letter-spacing: 1px;
      }

      .scale-display .small {
        display: block;
        margin-top: 3px;
        font-size: 9px;
        line-height: 1;
      }

      .scale-copy {
        top: 30.5%;
        width: 74%;
      }

      .scale-copy .white {
        color: var(--light);
        font-size: 17px;
        line-height: 1.05;
      }

      .scale-copy .yellow {
        color: var(--yellow);
        font-size: 40px;
        line-height: 0.98;
      }

      .scale-copy .pounds {
        color: var(--yellow);
        font-size: 68px;
        line-height: 0.95;
        margin-top: 20px;
      }

      .scale-copy .or {
        color: var(--light);
        font-size: 15px;
        line-height: 1;
        margin: 20px auto 0;
      }

      @media (max-width: 520px) {
        .phone {
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <a class="overview-link" href="overview.html">See overview</a>
    <main class="phone" aria-live="polite">
      <button class="back-arrow" type="button" aria-label="Go back">‹</button>
      <div data-screen-host></div>
    </main>

    <script src="flow-data.js?v=20260722-page19-video"></script>
    <script>
      const flow = window.SEE_ONBOARDING_FLOW;
      const host = document.querySelector("[data-screen-host]");
      const backArrow = document.querySelector(".back-arrow");
      const preloadedImages = new Map();
      const historyStack = [];
      const params = new URLSearchParams(window.location.search);
      const requestedScreen = params.get("screen");
      const cameFromOverview = params.get("from") === "overview";
      let active = flow.screens[requestedScreen] ? requestedScreen : flow.firstScreen;
      let goal = null;
      const patternAnswers = {
        drinkNoise: null,
        automaticDrinking: null,
      };
      let drinkIndex = flow.screens.drinks.selectedIndex;
      const selectedCostIndexes = new Set(flow.screens.cost.selectedIndexes || []);
      const defaultBenefitScreens = ["sleep", "energy", "physicalHealth", "focus", "memory", "relationships"];
      const costIndexToBenefitScreens = {
        0: ["physicalHealth"],
        1: ["focus", "memory"],
        3: ["sleep"],
        4: ["energy"],
        5: ["physicalHealth"],
        7: ["relationships"],
        8: ["relationships"],
        9: ["focus", "memory"],
        10: ["energy", "focus"],
      };
      let orderedBenefitScreens = defaultBenefitScreens;

      function preloadImage(src) {
        if (!src || preloadedImages.has(src)) return;
        const image = new Image();
        image.decoding = "async";
        image.src = src;
        preloadedImages.set(src, image);
      }

      function preloadFlowImages() {
        Object.values(flow.assets).forEach(preloadImage);
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function lineBreaks(value) {
        return escapeHtml(value).replaceAll("\n", "<br />");
      }

      function bodyMarkup(body, dark = false) {
        if (!body) return "";
        const items = Array.isArray(body) ? body : [body];
        return items.map((item) => `<p class="body ${dark ? "dark" : ""}">${lineBreaks(item)}</p>`).join("");
      }

      function progress(index) {
        if (!Number.isInteger(index)) return "";
        return `
          <div class="impact-progress" aria-hidden="true">
            ${Array.from({ length: 6 }, (_, itemIndex) => `<span class="${itemIndex === index ? "is-active" : ""}"></span>`).join("")}
          </div>
        `;
      }

      function buttonMarkup(label = "continue") {
        return `<button class="primary-button" type="button" data-continue>${escapeHtml(label)}</button>`;
      }

      function renderGoal(screen) {
        return `
          <section class="screen is-active" data-screen="goal">
            <div class="content-center">
              <h1 class="headline">${lineBreaks(screen.headline)}</h1>
              <div class="choice-stack">
                ${screen.choices
                  .map(
                    (choice) => `
                      <button class="choice ${choice.goal === goal ? "is-selected" : ""}" type="button" data-goal="${choice.goal}">
                        <span class="choice-icon"><img src="${flow.assets[choice.imageKey]}" alt="" /></span>
                        <span>${escapeHtml(choice.label)}</span>
                      </button>
                    `
                  )
                  .join("")}
              </div>
            </div>
          </section>
        `;
      }

      function renderRadio(screen) {
        return `
          <section class="screen is-active" data-screen="drinks">
            <div class="content-scroll">
              <h1 class="headline ${screen.headlineSize || "medium"}">${lineBreaks(screen.headline)}</h1>
              <div class="radio-list">
                ${screen.options
                  .map(
                    (option, index) => `
                      <button class="radio-row ${index === drinkIndex ? "is-selected" : ""}" type="button" data-drink-index="${index}">
                        <span class="ring"></span><span>${escapeHtml(option)}</span>
                      </button>
                    `
                  )
                  .join("")}
              </div>
            </div>
            ${buttonMarkup()}
          </section>
        `;
      }

      function renderChecklist(screen) {
        return `
          <section class="screen is-active" data-screen="cost">
            <div class="content-scroll">
              <h1 class="headline ${screen.headlineSize || "medium"}">${lineBreaks(screen.headline)}</h1>
              ${bodyMarkup(screen.body)}
              <div class="checklist">
                ${screen.options
                  .map(
                    (option, index) => `
                      <button class="check-row ${selectedCostIndexes.has(index) ? "is-selected" : ""}" type="button" data-cost-index="${index}">
                        <span class="ring"></span><span>${escapeHtml(option)}</span>
                      </button>
                    `
                  )
                  .join("")}
              </div>
            </div>
            ${buttonMarkup()}
          </section>
        `;
      }

      function renderScale(screen) {
        const scale = flow.sampleScale;
        return `
          <section class="screen is-active" data-screen="scale">
            <div class="content-center">
              <h1 class="headline ${screen.headlineSize || "medium"}">${lineBreaks(screen.headline)}</h1>
              <div class="scale-card">
                <img src="${flow.assets.scale}" alt="" />
                <div class="scale-display">
                  <span class="big">${scale.displayWeeklyDrinks} DRINKS</span>
                  <span class="small">PER WEEK</span>
                </div>
                <div class="scale-copy">
                  <div class="white">That’s</div>
                  <div class="yellow">${scale.dailyCaloriesLow}–${scale.dailyCaloriesHigh}</div>
                  <div class="white">calories per day</div>
                  <div class="or">or</div>
                  <div class="pounds">${scale.yearlyPounds} lbs</div>
                  <div class="white">per year.</div>
                </div>
              </div>
            </div>
            ${buttonMarkup()}
          </section>
        `;
      }

      function renderQuestion(screen) {
        return `
          <section class="screen is-active" data-screen="${active}">
            <div class="content-center">
              <h1 class="headline ${screen.headlineSize || "medium"}">${lineBreaks(screen.headline)}</h1>
              ${bodyMarkup(screen.body)}
              <div class="answer-row">
                <button class="answer-choice" type="button" data-answer="yes">${escapeHtml(screen.yes)}</button>
                <button class="answer-choice" type="button" data-answer="no">${escapeHtml(screen.no)}</button>
              </div>
            </div>
          </section>
        `;
      }

      function renderCopy(screen) {
        const imageMarkup = screen.imageKey
          ? `<img class="${screen.imageShape === "portrait" ? "portrait-photo" : "art"}" src="${flow.assets[screen.imageKey]}" alt="" loading="eager" decoding="async" />`
          : "";
        const imageBeforeBody = screen.imageShape === "portrait" ? "" : imageMarkup;
        const imageAfterBody = screen.imageShape === "portrait" ? imageMarkup : "";

        return `
          <section class="screen is-active" data-screen="${active}">
            <div class="content-center">
              <h1 class="headline ${screen.headlineSize || ""}">${lineBreaks(screen.headline)}</h1>
              ${imageBeforeBody}
              ${bodyMarkup(screen.body)}
              ${imageAfterBody}
            </div>
            ${buttonMarkup(screen.button)}
          </section>
        `;
      }

      function renderVideoCopy(screen) {
        const videoWidth = Number(screen.videoWidth) || 16;
        const videoHeight = Number(screen.videoHeight) || 9;
        const orientationClass = videoHeight > videoWidth ? "is-portrait" : "";
        const videoMarkup = screen.videoSrc
          ? `
              <div
                class="video-player-shell ${orientationClass}"
                style="--video-aspect-ratio: ${videoWidth} / ${videoHeight}"
              >
                <video
                  class="onboarding-video"
                  playsinline
                  preload="metadata"
                  poster="${escapeHtml(screen.videoPoster || "")}"
                  aria-label="${escapeHtml(screen.videoLabel || screen.headline || "Onboarding video")}"
                >
                  <source src="${escapeHtml(screen.videoSrc)}" type="video/mp4" />
                  Your browser does not support HTML video.
                </video>
                <button
                  class="video-play-button"
                  type="button"
                  data-video-play
                  aria-label="Play ${escapeHtml(screen.videoLabel || "onboarding video")}"
                ></button>
                ${
                  screen.videoDurationLabel
                    ? `<span class="video-timestamp" data-video-timestamp>${escapeHtml(screen.videoDurationLabel)}</span>`
                    : ""
                }
              </div>
            `
          : `<div class="video-placeholder">${escapeHtml(screen.videoLabel || "VIDEO")}</div>`;

        return `
          <section class="screen video-copy is-active" data-screen="${active}">
            <div class="content-center">
              <h1 class="headline ${screen.headlineSize || ""}">${lineBreaks(screen.headline)}</h1>
              ${screen.subhead ? `<p class="subhead">${lineBreaks(screen.subhead)}</p>` : ""}
              ${videoMarkup}
              ${bodyMarkup(screen.body)}
            </div>
            ${buttonMarkup(screen.button)}
          </section>
        `;
      }

      function renderArtCopy(screen) {
        return `
          <section class="screen is-active" data-screen="${active}">
            <div class="content-center">
              <h1 class="headline ${screen.headlineSize || ""}">${lineBreaks(screen.headline)}</h1>
              <img class="art" src="${flow.assets[screen.imageKey]}" alt="" loading="eager" decoding="async" />
              ${bodyMarkup(screen.body, true)}
            </div>
            ${buttonMarkup(screen.button)}
          </section>
        `;
      }

      function renderBenefit(screen) {
        const benefitIndex = orderedBenefitScreens.indexOf(active);
        const progressIndex = benefitIndex === -1 ? screen.progressIndex : benefitIndex;
        return `
          <section class="screen is-active" data-screen="${active}">
            ${progress(progressIndex)}
            <div class="content-center">
              <h1 class="headline ${screen.headlineSize || "medium"}">${lineBreaks(screen.headline)}</h1>
              ${bodyMarkup(screen.body)}
              <img class="art" src="${flow.assets[screen.imageKey]}" alt="" loading="eager" decoding="async" />
            </div>
            ${buttonMarkup()}
          </section>
        `;
      }

      function resolvedScreen() {
        const screen = flow.screens[active];
        if (!screen) return null;

        if (active === "withoutThinking" && patternAnswers.drinkNoise === false) {
          return { ...screen, ...flow.copyVariants.withoutThinkingDirect };
        }

        if (active === "catchAutomaticMoment" && patternAnswers.automaticDrinking === false) {
          const variant = patternAnswers.drinkNoise
            ? flow.copyVariants.catchThoughts
            : flow.copyVariants.catchUnrecognizedPattern;
          return { ...screen, ...variant };
        }

        return screen;
      }

      function renderScreen() {
        const screen = resolvedScreen();
        if (!screen) return "";
        if (screen.type === "goal") return renderGoal(screen);
        if (screen.type === "radio") return renderRadio(screen);
        if (screen.type === "checklist") return renderChecklist(screen);
        if (screen.type === "scale") return renderScale(screen);
        if (screen.type === "question") return renderQuestion(screen);
        if (screen.type === "artCopy") return renderArtCopy(screen);
        if (screen.type === "videoCopy") return renderVideoCopy(screen);
        if (screen.type === "benefit") return renderBenefit(screen);
        return renderCopy(screen);
      }

      function goTo(next, replace = false) {
        if (!next || !flow.screens[next]) return;
        if (!replace) historyStack.push(active);
        active = next;
        draw();
      }

      function buildOrderedBenefitScreens() {
        if (selectedCostIndexes.size === 0) return defaultBenefitScreens;

        const promoted = [];
        const seen = new Set();

        selectedCostIndexes.forEach((costIndex) => {
          const benefitScreens = costIndexToBenefitScreens[costIndex];
          if (!benefitScreens) return;

          benefitScreens.forEach((screenName) => {
            if (!seen.has(screenName)) {
              seen.add(screenName);
              promoted.push(screenName);
            }
          });
        });

        if (promoted.length === 0) return defaultBenefitScreens;

        return [
          ...promoted,
          ...defaultBenefitScreens.filter((screenName) => !seen.has(screenName)),
        ];
      }

      function nextFromCurrent(screen) {
        if (active === "grip") {
          orderedBenefitScreens = buildOrderedBenefitScreens();
          return orderedBenefitScreens[0];
        }

        const benefitIndex = orderedBenefitScreens.indexOf(active);
        if (benefitIndex !== -1) {
          return orderedBenefitScreens[benefitIndex + 1] || "questionsIntro";
        }

        return screen.next;
      }

      function continueFromCurrent() {
        const screen = resolvedScreen();
        if (!screen) return;
        if (screen.type === "goal") return;
        goTo(nextFromCurrent(screen));
      }

      function answerCurrent(answer) {
        const answeredYes = answer === "yes";

        if (active === "noiseQuestion1") {
          patternAnswers.drinkNoise = answeredYes;
          patternAnswers.automaticDrinking = null;
          goTo(answeredYes ? "drinkNoise" : "withoutThinking");
          return;
        }

        if (active === "automaticQuestion") {
          patternAnswers.automaticDrinking = answeredYes;
          goTo(answeredYes ? "automaticDrinking" : "catchAutomaticMoment");
          return;
        }

        continueFromCurrent();
      }

      function draw() {
        host.innerHTML = renderScreen();
        backArrow.classList.toggle("is-visible", historyStack.length > 0);

        host.querySelectorAll("[data-goal]").forEach((button) => {
          button.addEventListener("click", () => {
            goal = button.dataset.goal;
            const choice = flow.screens.goal.choices.find((item) => item.goal === goal);
            goTo(choice.next);
          });
        });

        host.querySelectorAll("[data-drink-index]").forEach((button) => {
          button.addEventListener("click", () => {
            drinkIndex = Number(button.dataset.drinkIndex);
            draw();
          });
        });

        host.querySelectorAll("[data-cost-index]").forEach((button) => {
          button.addEventListener("click", () => {
            const index = Number(button.dataset.costIndex);
            if (selectedCostIndexes.has(index)) {
              selectedCostIndexes.delete(index);
            } else {
              selectedCostIndexes.add(index);
            }
            button.classList.toggle("is-selected");
          });
        });

        host.querySelectorAll("[data-answer]").forEach((button) => {
          button.addEventListener("click", () => {
            button.classList.add("is-selected");
            host.querySelectorAll("[data-answer]").forEach((answerButton) => {
              answerButton.style.pointerEvents = "none";
            });
            window.setTimeout(() => answerCurrent(button.dataset.answer), 120);
          });
        });

        host.querySelectorAll("[data-video-play]").forEach((button) => {
          button.addEventListener("click", async () => {
            const video = button.parentElement?.querySelector("video");
            const timestamp = button.parentElement?.querySelector("[data-video-timestamp]");
            if (!video) return;

            button.hidden = true;
            if (timestamp) timestamp.hidden = true;
            video.controls = true;
            try {
              await video.play();
            } catch (_) {
              video.controls = false;
              button.hidden = false;
              if (timestamp) timestamp.hidden = false;
            }
          });
        });

        host.querySelector("[data-continue]")?.addEventListener("click", continueFromCurrent);
      }

      backArrow.addEventListener("click", () => {
        const previous = historyStack.pop();
        if (!previous && cameFromOverview) {
          window.location.href = "overview.html";
          return;
        }
        if (!previous) return;
        active = previous;
        draw();
      });

      preloadFlowImages();
      draw();
    </script>
  </body>
</html>
