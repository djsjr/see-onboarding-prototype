<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alcohol Onboarding Flow Overview</title>
    <style>
      @font-face {
        font-family: "Gilroy";
        src: url("assets/fonts/Gilroy-ExtraBold.otf") format("opentype");
        font-weight: 800;
      }

      @font-face {
        font-family: "Public Sans";
        src: url("assets/fonts/PublicSans-SemiBold.ttf") format("truetype");
        font-weight: 800;
      }

      :root {
        --blue: #3157c9;
        --dark: #252323;
        --light: #ffffff;
        --yellow: #fad250;
        --phone-width: 430px;
        --phone-height: 932px;
        --scale: 0.43;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #17120a;
        color: var(--light);
        font-family: "Public Sans", system-ui, sans-serif;
      }

      .overview-link {
        position: fixed;
        top: 18px;
        right: 18px;
        z-index: 5;
        color: var(--light);
        font: 800 14px/1 "Public Sans", sans-serif;
        text-decoration: none;
        background: rgba(49, 87, 201, 0.9);
        border-radius: 999px;
        padding: 10px 14px;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.24);
      }

      .board {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(calc(var(--phone-width) * var(--scale)), 1fr));
        gap: 28px 20px;
        align-items: start;
        padding: 70px 24px 34px;
      }

      .artboard-card {
        display: grid;
        justify-items: center;
        gap: 8px;
        color: inherit;
        text-decoration: none;
        border-radius: 18px;
        transition: transform 140ms ease;
      }

      .artboard-card:hover,
      .artboard-card:focus-visible {
        outline: none;
        transform: translateY(-3px);
      }

      .artboard-label {
        width: calc(var(--phone-width) * var(--scale));
        margin: 0;
        color: rgba(255, 255, 255, 0.78);
        font: 800 12px/1.1 "Public Sans", sans-serif;
      }

      .phone-crop {
        width: calc(var(--phone-width) * var(--scale));
        height: calc(var(--phone-height) * var(--scale));
        overflow: hidden;
        border-radius: 18px;
        box-shadow: 0 18px 36px rgba(0, 0, 0, 0.35);
        background: #ffe68e;
      }

      .phone {
        position: relative;
        width: var(--phone-width);
        height: var(--phone-height);
        overflow: hidden;
        color: var(--dark);
        transform: scale(var(--scale));
        transform-origin: top left;
        background: #ffe68e url("assets/images/background_yellow.png") center/cover no-repeat;
      }

      .phone.is-expanded {
        height: var(--expanded-height);
      }

      .screen {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        padding: 28px 24px 20px;
      }

      .content-center {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: stretch;
        min-height: 0;
      }

      .content-scroll {
        flex: 1;
        overflow: hidden;
        padding: 52px 0 22px 10px;
      }

      .headline {
        margin: 0;
        color: var(--dark);
        font: 800 50px/1.05 "Gilroy", sans-serif;
        white-space: pre-line;
      }

      .headline.medium {
        font-size: 42px;
      }

      .headline.size-48 {
        font-size: 48px;
      }

      .headline.size-46 {
        font-size: 46px;
      }

      .headline.size-44 {
        font-size: 44px;
      }

      .headline.size-40 {
        font-size: 40px;
      }

      .headline.small {
        font-size: 36px;
      }

      .body {
        margin: 20px 0 0;
        color: var(--blue);
        font: 800 18px/1.22 "Public Sans", sans-serif;
        white-space: pre-line;
      }

      .body.dark {
        color: var(--dark);
      }

      .social-proof-content {
        justify-content: flex-start;
        overflow: auto;
        padding: 18px 0;
      }

      .social-proof-group {
        margin: auto 0;
      }

      .social-proof .headline {
        font-size: 40px;
      }

      .review-stack {
        display: grid;
        gap: 14px;
        margin-top: 20px;
      }

      .review-card {
        border-radius: 30px;
        background: #fff;
        padding: 16px 20px 18px;
      }

      .review-quote,
      .review-attribution {
        margin: 0;
        color: var(--dark);
        font: 800 16px/1.28 "Public Sans", sans-serif;
      }

      .review-highlight {
        color: var(--blue);
      }

      .review-attribution {
        margin-top: 10px;
        text-align: right;
      }

      .social-proof .primary-button {
        width: 92%;
        margin: 0 auto;
      }

      .primary-button {
        width: 100%;
        min-height: 56px;
        border: 0;
        border-radius: 999px;
        background: var(--blue);
        color: var(--light);
        font: 800 18px/1 "Gilroy", sans-serif;
        box-shadow: 0 7px 12px rgba(37, 35, 35, 0.25);
      }

      .choice-stack,
      .radio-list,
      .checklist {
        display: grid;
        gap: 16px;
        margin-top: 30px;
      }

      .choice,
      .radio-row,
      .check-row,
      .answer-choice {
        border: 0;
        background: rgba(255, 255, 255, 0.5);
        color: var(--dark);
        border-radius: 10px;
        min-height: 76px;
        padding: 10px 14px;
        display: flex;
        align-items: center;
        gap: 14px;
        text-align: left;
        font: 800 22px/1.08 "Gilroy", sans-serif;
      }

      .choice.is-selected,
      .radio-row.is-selected,
      .check-row.is-selected {
        background: var(--blue);
        color: var(--light);
        box-shadow: 0 5px 10px rgba(37, 35, 35, 0.26);
      }

      .choice-icon {
        width: 78px;
        height: 78px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.94);
        display: grid;
        place-items: center;
        flex: 0 0 auto;
      }

      .choice-icon img {
        max-width: 48px;
        max-height: 48px;
      }

      .ring {
        width: 28px;
        height: 28px;
        border: 3px solid currentColor;
        border-radius: 50%;
        display: inline-grid;
        place-items: center;
        flex: 0 0 auto;
      }

      .is-selected .ring::after {
        content: "";
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: currentColor;
      }

      .answer-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        margin-top: 34px;
      }

      .answer-choice {
        justify-content: center;
        text-align: center;
      }

      .art {
        display: block;
        width: 72%;
        height: 245px;
        object-fit: contain;
        margin: 30px auto;
      }

      .video-placeholder {
        width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 10px;
        background: var(--blue);
        color: var(--light);
        display: grid;
        place-items: center;
        margin: 26px 0 6px;
        font: 800 24px/1 "Gilroy", sans-serif;
        box-shadow: 0 8px 18px rgba(37, 35, 35, 0.24);
      }

      .impact-progress {
        display: flex;
        gap: 4px;
        justify-content: center;
        margin-top: 2px;
      }

      .impact-progress span {
        width: 24px;
        height: 10px;
        transform: skewX(-28deg);
        background: rgba(49, 87, 201, 0.38);
      }

      .impact-progress span.is-active {
        width: 54px;
        background: var(--blue);
      }

      .scale-card {
        margin-top: 28px;
        position: relative;
      }

      .scale-card img {
        width: 100%;
        display: block;
      }

      .scale-display,
      .scale-copy {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        font-family: "Gilroy", sans-serif;
        font-weight: 800;
      }

      .scale-display {
        top: 3.8%;
        width: 42%;
        color: var(--yellow);
        background: #222;
        border: 2px solid rgba(255, 255, 255, 0.85);
        border-radius: 7px;
        padding: 7px 6px 4px;
      }

      .scale-display .big {
        display: block;
        font-size: 22px;
        line-height: 0.9;
        letter-spacing: 1px;
      }

      .scale-display .small {
        display: block;
        margin-top: 3px;
        font-size: 9px;
        line-height: 1;
      }

      .scale-copy {
        top: 30.5%;
        width: 74%;
      }

      .scale-copy .white {
        color: var(--light);
        font-size: 17px;
        line-height: 1.05;
      }

      .scale-copy .yellow {
        color: var(--yellow);
        font-size: 40px;
        line-height: 0.98;
      }

      .scale-copy .pounds {
        color: var(--yellow);
        font-size: 68px;
        line-height: 0.95;
        margin-top: 20px;
      }

      .scale-copy .or {
        color: var(--light);
        font-size: 15px;
        line-height: 1;
        margin: 20px auto 0;
      }
    </style>
  </head>
  <body>
    <a class="overview-link" href="index.html">See interactive</a>
    <main class="board" data-board></main>

    <script src="flow-data.js?v=20260802-social-proof"></script>
    <script>
      const flow = window.SEE_ONBOARDING_FLOW;
      const board = document.querySelector("[data-board]");

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function lineBreaks(value) {
        return escapeHtml(value).replaceAll("\n", "<br />");
      }

      function bodyMarkup(body, dark = false) {
        if (!body) return "";
        const items = Array.isArray(body) ? body : [body];
        return items.map((item) => `<p class="body ${dark ? "dark" : ""}">${lineBreaks(item)}</p>`).join("");
      }

      function button(label = "continue") {
        return `<button class="primary-button" type="button">${escapeHtml(label)}</button>`;
      }

      function progress(index) {
        if (!Number.isInteger(index)) return "";
        return `
          <div class="impact-progress" aria-hidden="true">
            ${Array.from({ length: 6 }, (_, itemIndex) => `<span class="${itemIndex === index ? "is-active" : ""}"></span>`).join("")}
          </div>
        `;
      }

      function renderGoal(screen) {
        return `
          <section class="screen">
            <div class="content-center">
              <h1 class="headline">${lineBreaks(screen.headline)}</h1>
              <div class="choice-stack">
                ${screen.choices
                  .map(
                    (choice) => `
                      <button class="choice" type="button">
                        <span class="choice-icon"><img src="${flow.assets[choice.imageKey]}" alt="" /></span>
                        <span>${escapeHtml(choice.label)}</span>
                      </button>
                    `
                  )
                  .join("")}
              </div>
            </div>
          </section>
        `;
      }

      function renderRadio(screen) {
        return `
          <section class="screen">
            <div class="content-scroll">
              <h1 class="headline ${screen.headlineSize || "medium"}">${lineBreaks(screen.headline)}</h1>
              <div class="radio-list">
                ${screen.options
                  .map(
                    (option, index) => `
                      <button class="radio-row ${index === screen.selectedIndex ? "is-selected" : ""}" type="button">
                        <span class="ring"></span><span>${escapeHtml(option)}</span>
                      </button>
                    `
                  )
                  .join("")}
              </div>
            </div>
            ${button()}
          </section>
        `;
      }

      function renderChecklist(screen) {
        return `
          <section class="screen">
            <div class="content-scroll">
              <h1 class="headline ${screen.headlineSize || "medium"}">${lineBreaks(screen.headline)}</h1>
              ${bodyMarkup(screen.body)}
              <div class="checklist">
                ${screen.options
                  .map(
                    (option, index) => `
                      <button class="check-row ${(screen.selectedIndexes || []).includes(index) ? "is-selected" : ""}" type="button">
                        <span class="ring"></span><span>${escapeHtml(option)}</span>
                      </button>
                    `
                  )
                  .join("")}
              </div>
            </div>
            ${button()}
          </section>
        `;
      }

      function renderScale(screen) {
        const scale = flow.sampleScale;
        return `
          <section class="screen">
            <div class="content-center">
              <h1 class="headline ${screen.headlineSize || "medium"}">${lineBreaks(screen.headline)}</h1>
              <div class="scale-card">
                <img src="${flow.assets.scale}" alt="" />
                <div class="scale-display">
                  <span class="big">${scale.displayWeeklyDrinks} DRINKS</span>
                  <span class="small">PER WEEK</span>
                </div>
                <div class="scale-copy">
                  <div class="white">That’s</div>
                  <div class="yellow">${scale.dailyCaloriesLow}–${scale.dailyCaloriesHigh}</div>
                  <div class="white">calories per day</div>
                  <div class="or">or</div>
                  <div class="pounds">${scale.yearlyPounds} lbs</div>
                  <div class="white">per year.</div>
                </div>
              </div>
            </div>
            ${button()}
          </section>
        `;
      }

      function renderQuestion(screen) {
        return `
          <section class="screen">
            <div class="content-center">
              <h1 class="headline ${screen.headlineSize || "medium"}">${lineBreaks(screen.headline)}</h1>
              ${bodyMarkup(screen.body)}
              <div class="answer-row">
                <button class="answer-choice" type="button">${escapeHtml(screen.yes)}</button>
                <button class="answer-choice" type="button">${escapeHtml(screen.no)}</button>
              </div>
            </div>
          </section>
        `;
      }

      function renderCopy(screen) {
        return `
          <section class="screen">
            <div class="content-center">
              <h1 class="headline ${screen.headlineSize || ""}">${lineBreaks(screen.headline)}</h1>
              ${bodyMarkup(screen.body)}
            </div>
            ${button(screen.button)}
          </section>
        `;
      }

      function renderVideoCopy(screen) {
        return `
          <section class="screen">
            <div class="content-center">
              <h1 class="headline ${screen.headlineSize || ""}">${lineBreaks(screen.headline)}</h1>
              ${bodyMarkup(screen.body)}
              <div class="video-placeholder">VIDEO</div>
            </div>
            ${button(screen.button)}
          </section>
        `;
      }

      function renderArtCopy(screen) {
        return `
          <section class="screen">
            <div class="content-center">
              <h1 class="headline ${screen.headlineSize || ""}">${lineBreaks(screen.headline)}</h1>
              <img class="art" src="${flow.assets[screen.imageKey]}" alt="" loading="eager" decoding="async" />
              ${bodyMarkup(screen.body, true)}
            </div>
            ${button(screen.button)}
          </section>
        `;
      }

      function renderBenefit(screen) {
        return `
          <section class="screen">
            ${progress(screen.progressIndex)}
            <div class="content-center">
              <h1 class="headline ${screen.headlineSize || "medium"}">${lineBreaks(screen.headline)}</h1>
              ${bodyMarkup(screen.body)}
              <img class="art" src="${flow.assets[screen.imageKey]}" alt="" loading="eager" decoding="async" />
            </div>
            ${button()}
          </section>
        `;
      }

      function renderReviews(screen) {
        return `
          <section class="screen social-proof">
            <div class="content-center social-proof-content">
              <div class="social-proof-group">
                <h1 class="headline ${screen.headlineSize || "size-40"}">${lineBreaks(screen.headline)}</h1>
                <div class="review-stack">
                  ${(screen.reviews || [])
                    .map((review) => {
                      const emphasis = review.emphasis || "";
                      const remainder = String(review.quote || "").startsWith(emphasis)
                        ? String(review.quote || "").slice(emphasis.length)
                        : String(review.quote || "");
                      return `
                        <article class="review-card">
                          <p class="review-quote">“<span class="review-highlight">${escapeHtml(emphasis)}</span>${escapeHtml(remainder)}”</p>
                          <p class="review-attribution">— ${escapeHtml(review.attribution)}</p>
                        </article>
                      `;
                    })
                    .join("")}
                </div>
              </div>
            </div>
            ${button(screen.button)}
          </section>
        `;
      }

      function renderScreen(screenName) {
        const screen = flow.screens[screenName];
        if (!screen) return "";
        if (screen.type === "goal") return renderGoal(screen);
        if (screen.type === "radio") return renderRadio(screen);
        if (screen.type === "checklist") return renderChecklist(screen);
        if (screen.type === "scale") return renderScale(screen);
        if (screen.type === "question") return renderQuestion(screen);
        if (screen.type === "artCopy") return renderArtCopy(screen);
        if (screen.type === "videoCopy") return renderVideoCopy(screen);
        if (screen.type === "benefit") return renderBenefit(screen);
        if (screen.type === "reviews") return renderReviews(screen);
        return renderCopy(screen);
      }

      board.innerHTML = flow.overview
        .map(
          (item) => `
            <a class="artboard-card" href="index.html?screen=${encodeURIComponent(item.screen)}&from=overview">
              <p class="artboard-label">${escapeHtml(item.label)}</p>
              <div class="phone-crop">
                <div class="phone">${renderScreen(item.screen)}</div>
              </div>
            </a>
          `
        )
        .join("");

      document.querySelectorAll(".phone-crop").forEach((crop) => {
        const phone = crop.querySelector(".phone");
        const screen = phone.querySelector(".screen");
        const scrollContent = screen.querySelector(".content-scroll");
        const scale = Number.parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--scale")) || 0.43;
        const neededHeight = Math.max(932, scrollContent ? scrollContent.scrollHeight + 130 : screen.scrollHeight);

        if (neededHeight > 932) {
          crop.style.height = `${neededHeight * scale}px`;
          phone.style.setProperty("--expanded-height", `${neededHeight}px`);
          phone.classList.add("is-expanded");
        }
      });
    </script>
  </body>
</html>
